[project]
name = "tickvault"
version = "0.1.0"
description = "Live crypto market-data pipeline: raw capture, normalized Parquet, validation and QA."
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets>=17.2",
    "msgspec>=0.22",
    "zstandard>=0.25",
    "pyarrow>=26",
    "polars>=1.30,<2",
    "duckdb>=1.5.6,<2",
    "typer>=0.27",
    "sortedcontainers>=2.4",
    "httpx>=0.28",
]

[project.scripts]
tickvault = "tickvault.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tickvault"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio",
    "hypothesis>=6.169",
    "ruff>=0.17",
    "mypy>=2.4",
    "pyarrow-stubs",
]
orchestration = [
    "dagster>=1.13.26,<2",
    "dagster-webserver",
]
dashboard = [
    "streamlit>=1.66",
]

[tool.uv]
default-groups = ["dev", "orchestration", "dashboard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "network: tests that talk to the live venues (deselected by default)",
]
addopts = "-m 'not network'"
